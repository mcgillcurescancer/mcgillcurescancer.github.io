name: Deploy to GitHub Pages

# Pull requests build but do not deploy. That is what makes `build` usable as a
# required status check on `main`: the check has to actually report on the PR,
# and a workflow that only triggers on push never would.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed by ref so a PR build can never cancel a `main` deploy: pushes to main
# share one group and supersede each other, while each PR gets its own.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Only a real deploy needs the artifact; on a PR the build itself is the
      # signal, and uploading ~5MB we would throw away just costs time.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
